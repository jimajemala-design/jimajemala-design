name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            export NODE=/opt/alt/alt-nodejs20/root/usr/bin/node
            export NPM=/opt/alt/alt-nodejs20/root/usr/lib/node_modules/npm/bin/npm-cli.js
            APP_DIR=~/domains/lightslategrey-spoonbill-532459.hostingersite.com/public_html/.builds/last-source
            echo ">>> Deploying to: $APP_DIR"
            cd "$APP_DIR"
            git pull origin main
            $NODE -e "
              const mysql = require('mysql2/promise');
              require('dotenv').config();
              (async () => {
                const db = await mysql.createConnection({
                  host: process.env.DB_HOST,
                  user: process.env.DB_USER,
                  password: process.env.DB_PASSWORD,
                  database: process.env.DB_NAME
                });
                await db.execute(\"UPDATE users SET role='admin' WHERE email='jimajemala@gmail.com'\");
                const [rows] = await db.execute(\"SELECT email, role FROM users WHERE email='jimajemala@gmail.com'\");
                console.log('Admin grant result:', JSON.stringify(rows));
                await db.end();
              })();
            "
            echo ">>> Installing dependencies..."
            $NODE /opt/alt/alt-nodejs20/root/usr/lib/node_modules/npm/bin/npm-cli.js install --production
            echo ">>> Restarting app..."
            touch ~/domains/lightslategrey-spoonbill-532459.hostingersite.com/public_html/restart.txt
            echo ">>> Deploy complete!"
