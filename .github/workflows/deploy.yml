name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo ">>> Finding node..."
            find / -name "node" -type f 2>/dev/null | grep -v proc | head -5
            echo ">>> Finding npm..."
            find / -name "npm" -type f 2>/dev/null | grep -v proc | head -5
            echo ">>> Finding git repos..."
            find ~/domains -name ".git" -type d 2>/dev/null | head -5
            echo ">>> Finding server.js..."
            find ~/domains -name "server.js" 2>/dev/null | grep -v node_modules | head -5
            echo ">>> Done!"
