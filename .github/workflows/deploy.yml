name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            export PATH=$PATH:~/.nvm/versions/node/$(ls ~/.nvm/versions/node | tail -1)/bin:/usr/local/bin
            APP_DIR=$(find ~ -name "server.js" -not -path "*/node_modules/*" 2>/dev/null | head -1 | xargs dirname)
            echo ">>> App dir: $APP_DIR"
            cd "$APP_DIR"
            git pull origin main
            npm install --production
            pm2 restart all || pm2 start server.js --name nutrifell
            sleep 4
            pm2 logs --lines 40 --nostream
            echo ">>> Done!"
