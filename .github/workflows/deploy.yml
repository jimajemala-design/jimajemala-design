name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            export PATH=$PATH:/usr/local/bin:/usr/bin:~/.local/bin
            NODE=$(which node || find /usr -name "node" 2>/dev/null | head -1)
            NPM=$(which npm || find /usr -name "npm" 2>/dev/null | head -1)
            PM2=$(which pm2 || find /usr/local/bin ~/.local/bin -name "pm2" 2>/dev/null | head -1)
            echo ">>> node: $NODE | npm: $NPM | pm2: $PM2"
            APP_DIR=$(find ~/domains -name "server.js" -not -path "*/.builds/*" -not -path "*/node_modules/*" 2>/dev/null | head -1 | xargs dirname)
            echo ">>> App dir: $APP_DIR"
            cd "$APP_DIR"
            git pull origin main
            $NPM install --production
            $PM2 restart all || $PM2 start server.js --name nutrifell
            sleep 4
            $PM2 logs --lines 40 --nostream
            echo ">>> Done!"
