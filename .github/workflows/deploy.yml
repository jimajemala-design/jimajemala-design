name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            SITE_DIR=~/domains/lightslategrey-spoonbill-532459.hostingersite.com/public_html
            echo ">>> Deploying to: $SITE_DIR"
            cd "$SITE_DIR"
            git pull origin main
            echo ">>> Installing dependencies..."
            npm install --production 2>/dev/null || npx --yes npm install --production
            echo ">>> Restarting app via Hostinger..."
            touch restart.txt
            echo ">>> Done!"
