<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile Setup — NutriBase Georgia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/auth.css" />
</head>
<body>
  <header class="navbar" id="navbar">
    <div class="navbar-inner">
      <a class="logo" href="/" aria-label="NutriBase Georgia home">
        <div class="logo-mark" aria-hidden="true">
          <svg width="16" height="18" viewBox="0 0 16 18" fill="none"><path d="M8 1C8 1 1.5 4.5 1.5 10.5C1.5 13.8 4.5 16.5 8 16.5C11.5 16.5 14.5 13.8 14.5 10.5C14.5 4.5 8 1 8 1Z" fill="white" fill-opacity="0.9"/></svg>
        </div>
        <div class="logo-wordmark"><span class="logo-name">NUTRIBASE</span><span class="logo-geo">GEORGIA</span></div>
      </a>
      <nav class="navbar-nav" id="navAuth" aria-label="Account"></nav>
    </div>
  </header>

  <main class="app-page">
    <div class="mesh-gradient" aria-hidden="true"></div>
    <div class="auth-wrap">
      <div class="auth-card wide">
        <div class="auth-head">
          <h1 class="auth-title">Set up your profile</h1>
          <p class="auth-sub">We'll build a precise, safe calorie plan for your goal</p>
        </div>

        <form id="profileForm" novalidate>
          <div class="form-group">
            <label class="form-label" for="pf-name">Full Name</label>
            <input class="form-input" id="pf-name" name="name" type="text" placeholder="Jane Doe" />
            <p class="form-error"></p>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="pf-age">Age</label>
              <input class="form-input" id="pf-age" name="age" type="number" min="13" max="100" placeholder="25" />
              <p class="form-error"></p>
            </div>
            <div class="form-group">
              <label class="form-label" for="pf-gender">Gender</label>
              <select class="form-select" id="pf-gender" name="gender">
                <option value="male">Male</option>
                <option value="female">Female</option>
              </select>
              <p class="form-error"></p>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="pf-weight">Current Weight (kg)</label>
              <input class="form-input" id="pf-weight" name="currentWeight" type="number" min="25" max="400" step="0.1" placeholder="80" />
              <p class="form-error"></p>
            </div>
            <div class="form-group">
              <label class="form-label" for="pf-target">Target Weight (kg)</label>
              <input class="form-input" id="pf-target" name="targetWeight" type="number" min="25" max="400" step="0.1" placeholder="72" />
              <p class="form-error"></p>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="pf-height">Height (cm)</label>
              <input class="form-input" id="pf-height" name="height" type="number" min="90" max="250" placeholder="175" />
              <p class="form-error"></p>
            </div>
            <div class="form-group">
              <label class="form-label" for="pf-timeline">Timeline</label>
              <select class="form-select" id="pf-timeline" name="timeline">
                <option value="4">4 weeks</option>
                <option value="8">8 weeks</option>
                <option value="12" selected>12 weeks</option>
                <option value="16">16 weeks</option>
                <option value="24">24 weeks</option>
                <option value="36">36 weeks</option>
                <option value="52">52 weeks (1 year)</option>
              </select>
              <p class="form-error"></p>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="pf-activity">Activity Level</label>
            <select class="form-select" id="pf-activity" name="activityLevel">
              <option value="sedentary">Sedentary — desk job, no exercise (×1.2)</option>
              <option value="light">Lightly Active — 1-3 days/week (×1.375)</option>
              <option value="moderate" selected>Moderately Active — 3-5 days/week (×1.55)</option>
              <option value="very">Very Active — 6-7 days/week (×1.725)</option>
              <option value="extreme">Extremely Active — athlete, 2×/day (×1.9)</option>
            </select>
          </div>

          <div class="goal-warning" id="goalWarning"></div>
          <div id="calorieResult"></div>

          <button class="btn-primary btn-block" type="submit">Save &amp; Continue</button>
        </form>
      </div>
    </div>
  </main>

  <script src="/js/auth.js"></script>
</body>
</html>
