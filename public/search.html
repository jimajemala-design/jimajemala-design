<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Search · NutriFell</title>
  <meta name="description" content="Search people, posts, recipes, hashtags and foods on NutriFell." />
  <meta name="theme-color" content="#080c14" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/feed.css" />
  <link rel="stylesheet" href="/css/profile.css" />
  <link rel="stylesheet" href="/css/phase3.css" />
</head>
<body class="feed-body">
  <header class="feed-top">
    <a class="icon-btn" href="/feed.html" aria-label="Back to feed">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
    </a>
    <a class="feed-logo" href="/feed.html">Nutri<span>Fell</span></a>
    <div style="flex:1"></div>
    <button class="icon-btn" data-notif-bell aria-label="Notifications">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
      <span class="badge-dot" data-notif-badge hidden>0</span>
    </button>
  </header>

  <main class="page-wrap">
    <h1 class="page-title">Search</h1>
    <div class="search-bar">
      <span class="s-ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4-4"/></svg></span>
      <input id="searchInput" type="search" placeholder="Search people, posts, #hashtags, foods…" aria-label="Search" autocomplete="off" />
      <button class="s-clear" id="searchClear" aria-label="Clear">✕</button>
    </div>
    <div class="filter-tabs" id="filterTabs" role="tablist">
      <button class="filter-tab active" data-type="all">All</button>
      <button class="filter-tab" data-type="people">People</button>
      <button class="filter-tab" data-type="posts">Posts</button>
      <button class="filter-tab" data-type="recipes">Recipes</button>
      <button class="filter-tab" data-type="hashtags">Hashtags</button>
      <button class="filter-tab" data-type="foods">Foods</button>
    </div>
    <div id="searchResults"></div>
  </main>

  <nav class="bottom-nav" aria-label="Primary">
    <a class="bn-item" href="/index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>Home</a>
    <a class="bn-item" href="/feed.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg>Feed</a>
    <a class="bn-item active" href="/search.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4-4"/></svg>Search</a>
    <a class="bn-create" href="/feed.html" aria-label="Feed"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></a>
    <button class="bn-item" data-notif-bell aria-label="Notifications" style="position:relative"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>Alerts<span class="bn-badge" data-notif-badge hidden>0</span></button>
    <a class="bn-item" id="bnProfile" href="/profile-view.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Profile</a>
  </nav>

  <script src="/js/i18n.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/notifications.js"></script>
  <script src="/js/post-modal.js"></script>
  <script src="/js/search.js"></script>
</body>
</html>
