<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Post · NutriFell</title>
  <meta name="description" content="A post on the NutriFell community feed." />
  <meta name="theme-color" content="#090A0A" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/post-detail.css" />

  <link rel="manifest" href="/manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
</head>
<body class="pd-body">

  <!-- Scrollable post + comments -->
  <main class="pd-scroll" id="pdScroll">
    <div class="pd-loading">
      <div class="pd-spinner" aria-hidden="true"></div>
      <p>Loading post…</p>
    </div>
  </main>

  <!-- Reply context chip (shown above the composer when replying) -->
  <div class="pd-reply-context" id="pdReplyCtx" aria-live="polite"></div>

  <!-- Comment composer (fixed, above the action dock) -->
  <div class="pd-composer" id="pdComposer"></div>

  <!-- Action dock (fixed, above the floating nav) -->
  <div class="pd-dock" id="pdDock" role="toolbar" aria-label="Post actions"></div>

  <script src="/js/i18n.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/bottomnav.js"></script>
  <script src="/js/post-detail.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
