<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Notifications · NutriFell</title>
  <meta name="description" content="Your NutriFell notifications — likes, comments, follows and mentions." />
  <meta name="theme-color" content="#080c14" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/feed.css" />
  <link rel="stylesheet" href="/css/phase3.css" />
</head>
<body class="feed-body">
  <header class="feed-top">
    <a class="icon-btn" href="/feed.html" aria-label="Back to feed">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
    </a>
    <a class="feed-logo" href="/feed.html">Nutri<span>Fell</span></a>
    <div style="flex:1"></div>
    <button class="icon-btn" id="markAllBtn" aria-label="Mark all read" title="Mark all read">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 7 17l-5-5"/><path d="m22 10-7.5 7.5L13 16"/></svg>
    </button>
  </header>

  <main class="page-wrap">
    <h1 class="page-title">Notifications</h1>
    <div class="filter-tabs" id="filterTabs" role="tablist">
      <button class="filter-tab active" data-type="">All</button>
      <button class="filter-tab" data-type="likes">Likes</button>
      <button class="filter-tab" data-type="comments">Comments</button>
      <button class="filter-tab" data-type="follows">Follows</button>
    </div>
    <div class="notif-page-list" id="notifPage"></div>
    <div id="sentinel" style="height:1px"></div>
  </main>

  <nav class="bottom-nav" aria-label="Primary">
    <a class="bn-item" href="/feed.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>Feed</a>
    <a class="bn-item" href="/search.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4-4"/></svg>Search</a>
    <a class="bn-create" href="/feed.html" aria-label="Feed"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></a>
    <a class="bn-item active" href="/notifications.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>Alerts</a>
    <a class="bn-item" id="bnProfile" href="/profile-view.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Profile</a>
  </nav>

  <script src="/js/auth.js"></script>
  <script src="/js/notifications.js"></script>
  <script>
    (function () {
      if (!Auth.isAuthed()) { location.href = '/login.html'; return; }
      var u = Auth.user();
      if (u) document.getElementById('bnProfile').href = '/profile-social.html?id=' + u.id;
      var host = document.getElementById('notifPage');
      var state = { type: '', page: 1, hasMore: true, loading: false };

      function skeleton() {
        var s = '';
        for (var i = 0; i < 6; i++) s += '<div class="notif-row"><div class="notif-av skel" style="border-radius:50%"></div><div class="notif-main"><div class="skel skel-line" style="width:70%"></div><div class="skel skel-line" style="width:30%;margin-top:8px"></div></div></div>';
        return s;
      }
      function empty() {
        return '<div class="feed-empty" style="padding:60px 20px"><span class="em">🔔</span><h3>Nothing here yet</h3><p style="color:var(--text-3)">When people interact with you it shows up here.</p></div>';
      }

      async function load(reset) {
        if (state.loading || (!reset && !state.hasMore)) return;
        state.loading = true;
        if (reset) { state.page = 1; state.hasMore = true; host.innerHTML = skeleton(); }
        try {
          var d = await Notif.fetchPage(state.page, state.type);
          if (reset) host.innerHTML = '';
          if (state.page === 1 && !d.notifications.length) { host.innerHTML = empty(); state.hasMore = false; return; }
          host.insertAdjacentHTML('beforeend', d.notifications.map(Notif.rowHTML).join(''));
          Notif.wireRows(host);
          state.hasMore = d.hasMore;
          state.page++;
        } catch (e) {
          if (reset) host.innerHTML = '<div class="feed-empty"><h3>Could not load notifications</h3></div>';
        } finally { state.loading = false; }
      }

      document.querySelectorAll('.filter-tab').forEach(function (t) {
        t.addEventListener('click', function () {
          document.querySelectorAll('.filter-tab').forEach(function (x) { x.classList.remove('active'); });
          t.classList.add('active');
          state.type = t.dataset.type;
          load(true);
        });
      });
      document.getElementById('markAllBtn').addEventListener('click', async function () {
        try { await Notif.markAll(); Notif.refreshCount(); load(true); if (window.toast) toast('All caught up', 'success', 1800); } catch (e) { if (window.toast) toast('Could not mark read', 'error'); }
      });

      var io = new IntersectionObserver(function (es) { if (es[0].isIntersecting) load(false); }, { rootMargin: '500px' });
      io.observe(document.getElementById('sentinel'));

      load(true);
    })();
  </script>
</body>
</html>
