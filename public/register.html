<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Create Account — NutriFell</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/auth.css" />

  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#22c55e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NutriFell">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
</head>
<body>
  <header class="navbar" id="navbar">
    <div class="nb-inner">
      <button class="nb-hamburger" id="nbHamburger" aria-label="Open menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <a class="nb-logo" href="/">Nutri<span>Fell</span></a>
      <div class="nb-right" id="navRight"></div>
    </div>
  </header>

  <main class="app-page">
    <div class="mesh-gradient" aria-hidden="true"></div>
    <div class="auth-wrap">
      <div class="auth-card">

        <!-- Single-step signup — email + password only -->
        <div id="detailsStep">
        <div class="auth-head">
          <div class="auth-logo" aria-hidden="true">
            <svg width="20" height="22" viewBox="0 0 16 18" fill="none"><path d="M8 1C8 1 1.5 4.5 1.5 10.5C1.5 13.8 4.5 16.5 8 16.5C11.5 16.5 14.5 13.8 14.5 10.5C14.5 4.5 8 1 8 1Z" fill="#051008"/></svg>
          </div>
          <h1 class="auth-title" data-i18n="register_title">Create your free account</h1>
          <p class="auth-sub" data-i18n="register_subtitle">Just an email and password — explore the app right away.</p>
        </div>

        <form id="registerForm" novalidate>
          <div class="form-group">
            <label class="form-label" for="reg-email" data-i18n="register_email">Email</label>
            <div class="input-wrap">
              <input class="form-input" id="reg-email" name="email" type="email" placeholder="you@email.com" autocomplete="email" />
              <span class="input-check">✓</span>
            </div>
            <p class="form-error"></p>
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-password" data-i18n="register_password">Password</label>
            <div class="input-wrap">
              <input class="form-input" id="reg-password" name="password" type="password" placeholder="At least 6 characters" autocomplete="new-password" />
              <button class="input-reveal" id="reg-reveal" type="button" aria-label="Show password" aria-pressed="false">Show</button>
            </div>
            <p class="form-error"></p>
          </div>
          <div class="form-group form-group--checkbox">
            <label class="form-label--checkbox">
              <input type="checkbox" id="reg-age" name="age_confirm" class="form-checkbox" />
              <span data-i18n="register_age_confirm">I confirm I am 18 years or older</span>
            </label>
            <p class="form-error" id="ageConfirmError"></p>
          </div>
          <button class="btn-primary btn-block" type="submit" data-i18n="register_btn">Create Account &amp; Start</button>
        </form>

        <p class="auth-foot"><span data-i18n="register_have_account">Already have an account?</span> <a href="/login.html" data-i18n="register_login">Log in</a></p>
        </div><!-- /detailsStep -->
      </div>
    </div>
  </main>

  <script src="/js/i18n.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(() => console.log('SW registered'))
          .catch(err => console.log('SW failed:', err));
      });
    }
  </script>
</body>
</html>
