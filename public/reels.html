<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Reels · NutriFell</title>
  <meta name="description" content="NutriFell Reels — short food and fitness videos from the community, full screen." />
  <meta name="theme-color" content="#000000" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/feed.css" />
  <link rel="stylesheet" href="/css/profile.css" />
  <link rel="stylesheet" href="/css/reels.css" />
</head>
<body class="reels-body">

  <!-- Minimal top overlay -->
  <header class="reels-top">
    <a class="reels-back" href="/feed.html" aria-label="Back to feed">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </a>
    <h1>Reels</h1>
    <button class="reels-mute" id="muteBtn" aria-label="Unmute">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="muteIcon"><path d="M11 5 6 9H2v6h4l5 4z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
    </button>
  </header>

  <!-- Vertical snap feed -->
  <main class="reels-container" id="reelsContainer" aria-label="Reels">
    <div class="reels-loading" id="reelsLoading"><span class="spinner"></span></div>
  </main>

  <!-- Comment sheet -->
  <div class="sheet-overlay" id="sheetOverlay"></div>
  <section class="sheet" id="commentSheet" aria-label="Comments" aria-modal="true" role="dialog">
    <div class="sheet-grab"></div>
    <div class="sheet-head"><h3 id="sheetCount">Comments</h3>
      <button class="icon-btn" id="sheetClose" aria-label="Close comments">✕</button></div>
    <div class="sheet-body" id="sheetBody"></div>
    <div class="sheet-compose">
      <input id="commentInput" placeholder="Add a comment…" aria-label="Add a comment" />
      <button id="commentSend" disabled>Post</button>
    </div>
  </section>

  <!-- Bottom nav (mobile) -->
  <nav class="bottom-nav reels-bottom" aria-label="Primary">
    <a class="bn-item" href="/feed.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>Feed</a>
    <a class="bn-item" href="/search.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4-4"/></svg>Explore</a>
    <a class="bn-item active" href="/reels.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m10 8 6 4-6 4V8z"/><rect x="3" y="4" width="18" height="16" rx="3"/></svg>Reels</a>
    <button class="bn-item" id="bnBell" data-notif-bell aria-label="Notifications" style="position:relative"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>Alerts<span class="bn-badge" id="bnBadge" data-notif-badge hidden>0</span></button>
    <a class="bn-item" id="bnProfile" href="/profile-view.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Profile</a>
  </nav>

  <script src="/js/i18n.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/notifications.js"></script>
  <script src="/js/reels.js"></script>
  <script>
    (function () {
      var u = (typeof Auth !== 'undefined' && Auth.isAuthed()) ? Auth.user() : null;
      if (u) {
        var bp = document.getElementById('bnProfile');
        if (bp) bp.href = '/profile-social.html?id=' + u.id;
      }
    })();
  </script>
</body>
</html>
