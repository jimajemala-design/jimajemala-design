<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Profile · NutriFell</title>
  <meta name="description" content="A NutriFell community profile." />
  <meta name="theme-color" content="#080c14" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/feed.css" />
  <link rel="stylesheet" href="/css/profile.css" />
</head>
<body class="feed-body">
  <header class="feed-top">
    <a class="icon-btn" href="/feed.html" aria-label="Back to feed">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
    </a>
    <a class="feed-logo" href="/feed.html">Nutri<span>Fell</span></a>
    <div style="flex:1"></div>
    <a class="feed-avatar-btn" id="topAvatar" href="/feed.html" aria-label="My feed">?</a>
  </header>

  <main class="prof-wrap" id="profWrap">
    <div class="feed-empty" id="profLoading"><span class="em">⏳</span><h3>Loading profile…</h3></div>
  </main>

  <!-- ── Bottom nav (mobile) ─────────────────────────────────────────── -->
  <nav class="bottom-nav" aria-label="Primary">
    <a class="bn-item" href="/feed.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>Feed</a>
    <a class="bn-item" href="/search.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4-4"/></svg>Explore</a>
    <a class="bn-create" href="/feed.html" aria-label="Feed"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></a>
    <a class="bn-item" href="/recipes.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 2v7a3 3 0 0 0 6 0V2M10 9v13M17 2c-1.5 1-2 3-2 6s.5 5 2 6V2z"/></svg>Recipes</a>
    <a class="bn-item active" id="bnProfile" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Profile</a>
  </nav>

  <!-- ── Edit-profile modal ──────────────────────────────────────────── -->
  <div class="modal-overlay" id="editModal" aria-modal="true" role="dialog" aria-label="Edit profile">
    <div class="modal">
      <div class="modal-head"><h2>Edit profile</h2>
        <button class="icon-btn" id="editClose" aria-label="Close">✕</button></div>
      <div class="modal-body">
        <div class="edit-cover-row" id="editCover">
          <button class="edit-cover-btn" id="editCoverBtn" type="button">📷 Cover</button>
          <div class="edit-avatar" id="editAvatar" role="button" tabindex="0">?<span class="cam">📷</span></div>
        </div>
        <input type="file" id="avatarFile" accept="image/jpeg,image/png,image/webp" hidden />
        <input type="file" id="coverFile" accept="image/jpeg,image/png,image/webp" hidden />

        <div class="modal-field">
          <label for="editName">Display name</label>
          <input id="editName" maxlength="50" placeholder="Your name" />
          <div class="field-error" id="errName"></div>
        </div>
        <div class="modal-field">
          <label for="editUsername">Username</label>
          <input id="editUsername" maxlength="20" placeholder="username" autocapitalize="none" autocomplete="off" spellcheck="false" />
          <div class="field-error" id="errUsername"></div>
        </div>
        <div class="modal-field">
          <label for="editBio">Bio</label>
          <textarea id="editBio" maxlength="150" placeholder="Tell the community about yourself"></textarea>
          <div class="char-count" id="bioCount">0/150</div>
        </div>
        <div class="modal-field">
          <label for="editLocation">Location</label>
          <input id="editLocation" maxlength="80" placeholder="e.g. Tbilisi, Georgia" />
        </div>
        <div class="modal-field">
          <label for="editWebsite">Website</label>
          <input id="editWebsite" maxlength="120" placeholder="yoursite.com" autocapitalize="none" />
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn-ghost" id="editCancel">Cancel</button>
        <button class="btn-post" id="editSave">Save</button>
      </div>
    </div>
  </div>

  <!-- ── Followers / following modal ─────────────────────────────────── -->
  <div class="modal-overlay" id="listModal" aria-modal="true" role="dialog" aria-label="People">
    <div class="modal" style="max-width:440px">
      <div class="modal-head"><h2 id="listTitle">Followers</h2>
        <button class="icon-btn" id="listClose" aria-label="Close">✕</button></div>
      <div class="modal-body">
        <div class="list-search"><input id="listSearch" type="search" placeholder="Search…" aria-label="Search people" /></div>
        <div class="list-body" id="listBody"></div>
      </div>
    </div>
  </div>

  <!-- ── Fullscreen post modal ───────────────────────────────────────── -->
  <div class="post-modal" id="postModal" aria-modal="true" role="dialog" aria-label="Post">
    <button class="pm-close" id="pmClose" aria-label="Close">✕</button>
    <button class="pm-nav pm-prev" id="pmPrev" aria-label="Previous post">‹</button>
    <button class="pm-nav pm-next" id="pmNext" aria-label="Next post">›</button>
    <div class="pm-shell" id="pmShell"></div>
  </div>

  <script src="/js/auth.js"></script>
  <script src="/js/profile-social.js"></script>
</body>
</html>
