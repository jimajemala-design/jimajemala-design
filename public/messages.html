<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Messages · NutriFell</title>
  <meta name="description" content="Your NutriFell direct messages — chat with the community about meals, recipes and progress." />
  <meta name="theme-color" content="#080c14" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/feed.css" />
  <link rel="stylesheet" href="/css/profile.css" />
  <link rel="stylesheet" href="/css/phase3.css" />
  <link rel="stylesheet" href="/css/messages.css" />
</head>
<body class="feed-body dm-body">

  <!-- ── Top bar ─────────────────────────────────────────────────────── -->
  <header class="feed-top">
    <a class="feed-logo" href="/feed.html">Nutri<span>Fell</span></a>
    <form class="feed-search" id="searchForm" role="search">
      <span aria-hidden="true" style="color:var(--text-3);display:grid"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4-4"/></svg></span>
      <input type="search" id="searchInput" placeholder="Search people, #hashtags…" aria-label="Search" />
    </form>
    <div class="feed-top-actions">
      <button class="icon-btn" id="topBell" data-notif-bell aria-label="Notifications">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        <span class="badge-dot" id="bellBadge" data-notif-badge hidden>0</span>
      </button>
      <button class="icon-btn active" id="topDM" aria-label="Messages" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-12 7.6L3 21l1.9-5.6A8.4 8.4 0 1 1 21 11.5z"/></svg>
        <span class="badge-dot" data-dm-badge hidden>0</span>
      </button>
      <a class="feed-avatar-btn" id="topAvatar" href="/login.html" aria-label="My profile">?</a>
    </div>
  </header>

  <!-- ── Shell ───────────────────────────────────────────────────────── -->
  <div class="feed-shell dm-shell-wrap">

    <!-- Left sidebar (desktop) -->
    <aside class="feed-rail" aria-label="Primary">
      <nav class="side-nav">
        <a class="side-item" href="/feed.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg> Feed</a>
        <a class="side-item" href="/search.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4-4"/></svg> Explore</a>
        <a class="side-item" href="/reels.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m10 8 6 4-6 4V8z"/><rect x="3" y="4" width="18" height="16" rx="3"/></svg> Reels</a>
        <a class="side-item active" href="/messages.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-12 7.6L3 21l1.9-5.6A8.4 8.4 0 1 1 21 11.5z"/></svg> Messages <span class="side-dm-badge" data-dm-badge hidden>0</span></a>
        <a class="side-item" id="sideProfile" href="/profile-view.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg> Profile</a>
        <a class="side-item" href="/fridge.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M5 10h14"/></svg> My Fridge</a>
        <a class="side-item" href="/recipes.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 2v7a3 3 0 0 0 6 0V2M10 9v13M17 2c-1.5 1-2 3-2 6s.5 5 2 6V2z"/></svg> Recipes</a>
      </nav>
    </aside>

    <!-- DM two-pane -->
    <main class="dm-shell" id="dmShell">
      <!-- Conversation list -->
      <section class="dm-list" id="dmList" aria-label="Conversations">
        <div class="dm-list-head">
          <h1>Messages</h1>
        </div>
        <div class="dm-convos" id="dmConvos">
          <div class="dm-skeleton">
            <div class="skeleton dm-skel-row"></div>
            <div class="skeleton dm-skel-row"></div>
            <div class="skeleton dm-skel-row"></div>
          </div>
        </div>
      </section>

      <!-- Thread -->
      <section class="dm-thread" id="dmThread" aria-label="Conversation">
        <div class="dm-empty" id="dmEmpty">
          <span class="em" aria-hidden="true">✉️</span>
          <h2>Your messages</h2>
          <p>Pick a conversation, or start one from someone's profile. Swap recipes, share wins, keep each other on track.</p>
          <a class="btn-post" href="/search.html">Find people to message</a>
        </div>

        <div class="dm-active" id="dmActive" hidden>
          <header class="dm-thread-head">
            <button class="dm-back icon-btn" id="dmBack" aria-label="Back to conversations">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            </button>
            <a class="dm-peer" id="dmPeer" href="#">
              <span class="dm-peer-av" id="dmPeerAv"><span id="dmPeerInitial">?</span><span class="dm-presence-dot" id="dmPeerDot" hidden></span></span>
              <span class="dm-peer-meta"><b id="dmPeerName">…</b><small id="dmPeerStatus"></small></span>
            </a>
          </header>

          <div class="dm-messages" id="dmMessages" aria-live="polite"></div>
          <div class="dm-typing-row" id="dmTypingRow" hidden><span class="dm-typing-dots"><i></i><i></i><i></i></span> <span id="dmTypingName">typing…</span></div>

          <form class="dm-compose" id="dmCompose">
            <textarea id="dmInput" rows="1" maxlength="2000" placeholder="Message…" aria-label="Write a message"></textarea>
            <button type="submit" id="dmSend" class="dm-send" disabled aria-label="Send message">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
            </button>
          </form>
        </div>
      </section>
    </main>
  </div>

  <!-- ── Bottom nav (mobile) ─────────────────────────────────────────── -->
  <nav class="bottom-nav" aria-label="Primary">
    <a class="bn-item" href="/feed.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>Feed</a>
    <a class="bn-item" href="/search.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4-4"/></svg>Explore</a>
    <a class="bn-item active" href="/messages.html" style="position:relative"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-12 7.6L3 21l1.9-5.6A8.4 8.4 0 1 1 21 11.5z"/></svg>Messages<span class="bn-badge" data-dm-badge hidden>0</span></a>
    <button class="bn-item" id="bnBell" data-notif-bell aria-label="Notifications" style="position:relative"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>Alerts<span class="bn-badge" id="bnBadge" data-notif-badge hidden>0</span></button>
    <a class="bn-item" id="bnProfile" href="/profile-view.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Profile</a>
  </nav>

  <script src="/js/auth.js"></script>
  <script src="/js/notifications.js"></script>
  <script src="/js/messages.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/socket-client.js"></script>
  <script>
    (function () {
      var u = (typeof Auth !== 'undefined' && Auth.isAuthed()) ? Auth.user() : null;
      var av = document.getElementById('topAvatar');
      if (u) {
        var ini = (u.name || u.email || '?').trim().charAt(0).toUpperCase();
        av.textContent = ini;
        av.href = '/profile-social.html?id=' + u.id;
        document.getElementById('sideProfile').href = '/profile-social.html?id=' + u.id;
        document.getElementById('bnProfile').href = '/profile-social.html?id=' + u.id;
      }
      var form = document.getElementById('searchForm');
      if (form) form.addEventListener('submit', function (e) {
        e.preventDefault();
        var q = document.getElementById('searchInput').value.trim();
        if (!q) { location.href = '/search.html'; return; }
        if (q.charAt(0) === '#') location.href = '/hashtag.html?tag=' + encodeURIComponent(q.slice(1));
        else location.href = '/search.html?q=' + encodeURIComponent(q);
      });
    })();
  </script>
</body>
</html>
